min_version = "2026.7.17"

[settings]
lockfile = true

[tools]
rust = { version = "1.97.1", components = "clippy,rustfmt", profile = "minimal" }
node = "24.19.0"
pnpm = "11.21.0"

[env]
CARGO_TERM_COLOR = "always"

[tasks."rust:fmt"]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks."rust:clippy"]
description = "Lint every Rust target with warnings denied"
run = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings"

[tasks."rust:test"]
description = "Run all Rust tests with locked dependencies"
run = "cargo test --workspace --all-features --locked"

[tasks."rust:build"]
description = "Build optimized release binaries without test-only features"
run = "cargo build --workspace --release --locked"

[tasks."frontend:install"]
description = "Install frontend dependencies from the frozen workspace lockfile"
run = "pnpm install --frozen-lockfile"

[tasks."frontend:check"]
description = "Lint, type-check, test, and build the desktop presentation layer"
depends = ["frontend:install"]
run = [
  "pnpm lint",
  "pnpm typecheck",
  "pnpm test",
  "pnpm build",
]

[tasks."branding:check"]
description = "Validate deterministic branding assets"
run = "./scripts/check-icons.sh"

[tasks."audio:check"]
description = "Validate the deterministic Aizu notification sound"
run = "node scripts/generate-notification-sound.mjs --check"

[tasks."docs:check"]
description = "Validate documentation and schema contracts"
run = "node scripts/check-docs-contract.mjs"

[tasks."cli:installer:test"]
description = "Test the source CLI installer in isolated homes"
run = "./scripts/test-install-cli.sh"

[tasks."ci:check"]
description = "Validate the bounded GitHub Actions runner budget"
run = [
  "node scripts/check-ci-budget.mjs",
  "node scripts/check-release-workflow.mjs",
]

[tasks.check]
description = "Run the local CI-equivalent repository quality gates"
run = [
  { task = "rust:fmt" },
  { task = "rust:clippy" },
  { task = "rust:test" },
  { task = "docs:check" },
  { task = "cli:installer:test" },
  { task = "ci:check" },
  { task = "branding:check" },
  { task = "audio:check" },
  { task = "frontend:check" },
]

[tasks.build]
description = "Build all currently implemented release artifacts"
run = [{ task = "rust:build" }]

[tasks.ci]
description = "Run checks and release builds"
run = [
  { task = "check" },
  { task = "build" },
]

[tasks."cli:smoke"]
description = "Exercise the durable CLI event pipeline in an isolated directory"
run = """
#!/usr/bin/env bash
set -euo pipefail

state_dir="$(mktemp -d)"
trap 'rm -rf "$state_dir"' EXIT

cargo run --quiet -p aizu-cli -- \
  --state-dir "$state_dir" \
  --display-name mise-smoke \
  emit task.completed \
  --title "Smoke test completed" \
  --outcome succeeded \
  --json

cargo run --quiet -p aizu-cli -- \
  --state-dir "$state_dir" \
  doctor --json

cargo run --quiet -p aizu-cli -- \
  --state-dir "$state_dir" \
  bridge --protocol 1 --after 0
"""
