[package]
name = "aizu-desktop"
version = "0.1.0"
description = "Aizu menu-bar desktop application"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[lib]
name = "aizu_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
aizu-core = { version = "0.1.0", path = "../../../crates/aizu-core" }
chrono = { workspace = true }
directories = { workspace = true }
nix = { version = "0.31.2", features = ["signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
sys-locale = "0.3.2"
sysinfo = "0.39.6"
tauri = { version = "2.11.5", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
thiserror = "2.0.20"
uuid = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
mac-usernotifications = "0.3.1"
notify-rust = { version = "4.18.0", default-features = false, features = ["preview-macos-un"] }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSSound"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSString"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
