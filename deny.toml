[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
# The 2024/2025 entries are transitive Tauri 2 Linux/WebKit build dependencies
# with no safe upgrade. The macOS MVP does not load GTK; CI keeps them explicit
# so any new advisory still fails. Re-evaluate on each Tauri upgrade.
#
# RUSTSEC-2026-0194/0195 affect quick-xml 0.38, which is declared only by the
# Windows backend of user-notify-reborn. Aizu enables that crate only as a
# macOS target dependency, so quick-xml is absent from every actual target
# graph (`cargo tree --target <target> -i quick-xml@0.38.4`). Re-evaluate when
# user-notify-reborn publishes an update or Aizu enables its Windows backend.
# The exact same two target-only exceptions are passed to cargo-audit in PR and
# weekly CI; scripts/check-ci-budget.mjs keeps those policies synchronized.
ignore = [
  "RUSTSEC-2024-0370",
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
