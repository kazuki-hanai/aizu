name: Branding CI

on:
  pull_request:
    paths:
      - "assets/branding/**"
      - "apps/desktop/src-tauri/icons/**"
      - "scripts/check-icons.sh"
      - "scripts/generate-icons.mjs"
      - "scripts/generate-icons.sh"
      - "scripts/inspect-icons.mjs"
      - "scripts/test-branding-integrity.sh"
      - "scripts/verify-agent-assets.mjs"
      - ".github/workflows/branding.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: branding-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branding-assets:
    name: branding-assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Validate canonical and generated assets
        run: ./scripts/check-icons.sh
      - name: Reject modified canonical assets
        run: ./scripts/test-branding-integrity.sh
