name: Packaging CI

on:
  pull_request:
    paths:
      - "README.md"
      - "assets/branding/dmg/**"
      - "apps/desktop/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "scripts/build-dev-dmg.sh"
      - "scripts/install-dev-app.sh"
      - "scripts/prepare-desktop-cli.sh"
      - ".github/workflows/packaging.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaging-dmg-macos:
    name: packaging-dmg-macos
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Install frozen dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build verified development DMG
        run: ./scripts/build-dev-dmg.sh
      - name: Inspect installer payload
        run: |
          dmg=$(find target/debug/bundle/dmg -maxdepth 1 -name 'Aizu_*.dmg' -print -quit)
          test -n "$dmg"
          hdiutil verify -quiet "$dmg"
          mount_point="$RUNNER_TEMP/aizu-dmg"
          mkdir "$mount_point"
          hdiutil attach -quiet -readonly -nobrowse -mountpoint "$mount_point" "$dmg"
          trap 'hdiutil detach -quiet "$mount_point"' EXIT
          test -d "$mount_point/Aizu.app"
          test -f "$mount_point/Applications"
          attributes=$(GetFileInfo -a "$mount_point/Applications")
          case "$attributes" in
            *A*) ;;
            *) echo "Applications item is not a Finder alias" >&2; exit 1 ;;
          esac
          test -s "$mount_point/Applications/..namedfork/rsrc"
          test -f "$mount_point/.background/background.png"
          test "$(sips -g pixelWidth "$mount_point/.background/background.png" | awk '/pixelWidth:/ {print $2}')" = 660
          test "$(sips -g pixelHeight "$mount_point/.background/background.png" | awk '/pixelHeight:/ {print $2}')" = 400
          codesign --verify --deep --strict "$mount_point/Aizu.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$mount_point/Aizu.app/Contents/Info.plist")" = dev.aizu.desktop
