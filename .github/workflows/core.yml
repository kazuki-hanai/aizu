name: Core CI

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "docs/**"
      - "tests/fixtures/**"
      - "mise.toml"
      - "mise.lock"
      - ".github/workflows/core.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-quality:
    name: rust-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy -p aizu-core -p aizu-cli --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p aizu-core -p aizu-cli --all-features --locked
      - run: cargo build -p aizu-core -p aizu-cli --release --locked
