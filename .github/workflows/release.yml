name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build a rehearsal or publish a protected signed release
        required: true
        type: choice
        default: rehearsal
        options:
          - rehearsal
          - publish
      version:
        description: Exact SemVer without the v prefix
        required: true
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_MODE: ${{ github.event_name == 'push' && 'publish' || inputs.mode }}
  RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  preflight:
    name: release-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Resolve and validate release inputs
        id: release
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            RELEASE_VERSION=${RELEASE_VERSION#v}
            echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          fi
          node scripts/release/preflight.mjs
      - name: Require successful PR CI for the merged release change
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=$(gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].number // empty')
          test -n "$pr_number" || { echo "release commit is not associated with a merged main PR" >&2; exit 1; }
          pr_head=$(gh api "/repos/$GITHUB_REPOSITORY/pulls/$pr_number" \
            --jq 'select(.merged == true and .merge_commit_sha == env.GITHUB_SHA) | .head.sha')
          test -n "$pr_head" || { echo "PR #$pr_number does not merge to $GITHUB_SHA" >&2; exit 1; }
          run_count=$(gh api \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$pr_head&status=success&per_page=20" \
            --jq '[.workflow_runs[] | select(.event == "pull_request" and .conclusion == "success")] | length')
          test "$run_count" -gt 0 || { echo "no successful PR CI exists for PR #$pr_number head $pr_head" >&2; exit 1; }
      - name: Run full release source checks
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          cargo fmt --all --check
          cargo clippy --locked -p aizu-core -p aizu-cli --all-targets --all-features -- -D warnings
          cargo test --locked -p aizu-core -p aizu-cli --all-features
          pnpm lint
          pnpm typecheck
          pnpm test
          node scripts/check-docs-contract.mjs
          node scripts/check-ci-budget.mjs
          node scripts/check-release-workflow.mjs
          node scripts/check-secrets.mjs

  cli:
    name: cli-linux
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu
      - name: Install pinned cross linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-aarch64-linux-gnu
      - name: Build and package standalone Linux CLIs
        run: |
          cargo build --locked --release -p aizu-cli --target x86_64-unknown-linux-gnu
          CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc \
            CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo build --locked --release -p aizu-cli --target aarch64-unknown-linux-gnu
          target/x86_64-unknown-linux-gnu/release/aizu version --json
          file target/aarch64-unknown-linux-gnu/release/aizu | grep -F 'ARM aarch64'
          scripts/release/package-cli.sh x86_64-unknown-linux-gnu linux x64 "${{ needs.preflight.outputs.version }}" release-assets
          scripts/release/package-cli.sh aarch64-unknown-linux-gnu linux aarch64 "${{ needs.preflight.outputs.version }}" release-assets
      - name: Upload CLI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-linux
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macos-universal-release-set
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 120
    environment: ${{ needs.preflight.outputs.publish == 'true' && 'release-signing' || null }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Install frozen frontend dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Generate verified DMG background
        run: |
          mkdir -p target/release-inputs
          sips -s format png assets/branding/dmg/background.svg --out target/release-inputs/dmg-background.png >/dev/null
          test "$(sips -g pixelWidth target/release-inputs/dmg-background.png | awk '/pixelWidth:/ { print $2 }')" = 660
          test "$(sips -g pixelHeight target/release-inputs/dmg-background.png | awk '/pixelHeight:/ { print $2 }')" = 400
      - name: Require protected signing configuration
        if: needs.preflight.outputs.publish == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for variable in APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_CONTENT APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY; do
            test -n "${!variable}" || { echo "missing protected release secret: $variable" >&2; exit 1; }
          done
      - name: Import Developer ID certificate
        if: needs.preflight.outputs.publish == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/aizu-release.p12"
          keychain="$RUNNER_TEMP/aizu-release.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain"
      - name: Configure App Store Connect key
        if: needs.preflight.outputs.publish == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
      - name: Build signed, notarized macOS release set
        if: needs.preflight.outputs.publish == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: scripts/release/build-macos-targets.sh publish "${{ needs.preflight.outputs.version }}" release-assets
      - name: Build unsigned macOS rehearsal set
        if: needs.preflight.outputs.publish != 'true'
        run: scripts/release/build-macos-targets.sh rehearsal "${{ needs.preflight.outputs.version }}" release-assets
      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-release-set
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: release-assets
    needs: [preflight, cli, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Download all target artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "{cli,macos}-*"
          path: release-assets
          merge-multiple: true
      - name: Generate SPDX SBOM
        run: |
          scripts/release/install-cargo-sbom.sh
          cargo sbom --output-format=spdx_json_2_3 > release-assets/SBOM.spdx.json
      - name: Assemble checksums and updater metadata
        run: node scripts/release/assemble.mjs release-assets "${{ needs.preflight.outputs.version }}" "$RELEASE_MODE" "$GITHUB_REPOSITORY" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Verify updater signatures with the checked-in public key
        if: needs.preflight.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign
          updater_public_key=$(node -p "JSON.parse(require('fs').readFileSync('apps/desktop/src-tauri/tauri.conf.json')).plugins.updater.pubkey")
          for archive in release-assets/*.app.tar.gz; do
            minisign -Vm "$archive" -x "$archive.sig" -P "$updater_public_key"
          done
      - name: Verify assembled artifacts
        run: node scripts/release/verify.mjs release-assets
      - name: Upload assembled release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets-${{ needs.preflight.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  attest:
    name: release-attestation
    if: needs.preflight.outputs.publish == 'true'
    needs: [preflight, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - name: Download assembled release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ needs.preflight.outputs.version }}
          path: release-assets
      - name: Attest all release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

  publish:
    name: release-publish
    if: needs.preflight.outputs.publish == 'true'
    needs: [preflight, assemble, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release-publish
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets-${{ needs.preflight.outputs.version }}
          path: release-assets
      - name: Verify checksums and provenance after download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release-assets && sha256sum --check SHA256SUMS)
          gh attestation verify release-assets/* --repo "$GITHUB_REPOSITORY"
      - name: Create immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            && { echo "release $TAG already exists; published versions are immutable" >&2; exit 1; }
          gh release create "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName --jq 'select(.isDraft == true and .tagName == env.TAG)'
