name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a version tag contained in origin/main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo "invalid release tag: $GITHUB_REF_NAME"; exit 1; }
          git rev-parse --verify origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag commit is not contained in origin/main"; exit 1; }
      - name: Require successful CI for the exact tag commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=10" --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          test "$successful_runs" -gt 0 || { echo "no successful CI workflow exists for $GITHUB_SHA"; exit 1; }

  signed-macos-release:
    needs: release-provenance
    runs-on: macos-14
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require approved branding and signed-only updater configuration
        run: |
          node -e '
            const branding = require("./assets/branding/icon-manifest.json");
            const tauri = require("./apps/desktop/src-tauri/tauri.conf.json");
            const updater = tauri.plugins?.updater;
            if (branding.branding_status !== "approved" || branding.release_approved !== true) process.exit(1);
            if (tauri.bundle?.createUpdaterArtifacts !== true || typeof updater?.pubkey !== "string" || updater.pubkey.length < 32) process.exit(1);
          '
      - name: Require protected signing configuration
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for variable in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY; do
            test -n "${!variable}" || { echo "missing protected release secret: $variable"; exit 1; }
          done
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Install frontend dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate="$RUNNER_TEMP/certificate.p12"
          keychain="$RUNNER_TEMP/aizu.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$RUNNER_TEMP" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$RUNNER_TEMP" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
      - name: Build, sign, notarize, and generate configured updater artifacts
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter @aizu/desktop exec tauri build
      - name: Generate checksum and SBOM
        run: |
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/Aizu.app release-assets/Aizu-macos.zip
          find target/release/bundle -maxdepth 4 -type f \( -name '*.dmg' -o -name '*.sig' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;
          shasum -a 256 release-assets/* > release-assets/SHA256SUMS
          cargo install cargo-sbom --version 0.10.0 --locked
          cargo sbom --output-format=spdx_json_2_3 > release-assets/aizu.spdx.json
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: release-assets/*
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes
