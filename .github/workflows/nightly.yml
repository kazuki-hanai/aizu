name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Run core and CLI tests
        run: cargo test --locked -p aizu-core -p aizu-cli --all-features

  macos-package-dry-run:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Install frontend dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build unsigned application bundle
        run: ./scripts/build-dev-dmg.sh

  durability-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Repeat concurrent process emission
        shell: bash
        run: |
          for iteration in $(seq 1 20); do
            echo "concurrency iteration ${iteration}"
            cargo test --locked -p aizu-cli --test cli concurrent_process_emit_allocates_every_sequence_once -- --exact
          done
      - name: Repeat reconnect replay and cursor recovery
        shell: bash
        run: |
          for iteration in $(seq 1 50); do
            echo "reconnect iteration ${iteration}"
            cargo test --locked -p aizu-core remote::tests::exact_replay_is_deduplicated_after_reconnect -- --exact
          done

  previous-release-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Migrate the previous desktop release fixture
        run: cargo test --locked -p aizu-core desktop::tests::previous_release_desktop_fixture_migrates_to_current_schema -- --exact

  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Audit Rust advisories
        run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit
      - name: Enforce advisory, license, and source policy
        run: cargo install cargo-deny --version 0.20.2 --locked && cargo deny check advisories bans licenses sources
