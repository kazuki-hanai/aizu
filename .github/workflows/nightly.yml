name: Weekly deep checks

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-deep-checks
  cancel-in-progress: true

jobs:
  platform:
    name: weekly-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: macos
            os: macos-14
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Set up pinned Node.js
        if: matrix.platform == 'macos' || matrix.platform == 'linux'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Restore Rust dependency cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: weekly-${{ matrix.platform }}-rust-1.97.1-security-0.22.2-0.20.2-${{ hashFiles('Cargo.lock') }}
      - name: Test core and CLI on every platform
        run: cargo test --locked -p aizu-core -p aizu-cli --all-features
      - name: Run Linux durability and migration checks
        if: matrix.platform == 'linux'
        shell: bash
        run: ./scripts/ci/weekly-linux.sh
      - name: Build and verify macOS package
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          ./scripts/build-dev-dmg.sh
          ./scripts/ci/verify-dev-dmg.sh
