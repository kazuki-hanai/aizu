name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      macos_required: ${{ steps.changes.outputs.macos_required }}
      package_required: ${{ steps.changes.outputs.package_required }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Detect documentation-only changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci/classify-changes.mjs "$BASE_SHA" "$HEAD_SHA"
      - name: Set up pinned Rust toolchain
        if: steps.changes.outputs.macos_required == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Restore Rust dependency cache
        if: steps.changes.outputs.macos_required == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: linux-rust-1.97.1-security-0.22.2-0.20.2-${{ hashFiles('Cargo.lock') }}
      - name: Install Linux SSH fixture
        if: steps.changes.outputs.macos_required == 'true'
        run: sudo apt-get update && sudo apt-get install --yes openssh-server
      - name: Install frozen frontend dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Validate docs, branding, and audio
        run: |
          node scripts/check-docs-contract.mjs
          node scripts/check-ci-budget.mjs
          ./scripts/check-icons.sh
          ./scripts/test-branding-integrity.sh
          node scripts/generate-notification-sound.mjs --check
      - name: Check and test cross-platform Rust
        if: steps.changes.outputs.macos_required == 'true'
        run: |
          cargo fmt --all --check
          cargo build --locked -p aizu-cli
          cargo clippy --locked -p aizu-core -p aizu-cli --all-targets --all-features -- -D warnings
          cargo test --locked -p aizu-core -p aizu-cli --all-features
      - name: Check and test desktop frontend
        if: steps.changes.outputs.macos_required == 'true'
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Run real SSH integration
        if: steps.changes.outputs.macos_required == 'true'
        run: ./scripts/ci/ssh-integration-linux.sh
      - name: Install pinned Rust security tools
        if: steps.changes.outputs.macos_required == 'true'
        run: |
          cargo audit --version 2>/dev/null | grep -F '0.22.2' \
            || cargo install cargo-audit --version 0.22.2 --locked --force
          cargo deny --version 2>/dev/null | grep -F '0.20.2' \
            || cargo install cargo-deny --version 0.20.2 --locked --force
      - name: Enforce dependency and repository policy
        if: steps.changes.outputs.macos_required == 'true'
        run: |
          cargo audit
          cargo deny check advisories bans licenses sources
          pnpm audit --prod --audit-level high
          pnpm audit --dev --audit-level high --ignore GHSA-jmr9-qjv8-65gv
      - name: Reject committed credential material
        run: node scripts/check-secrets.mjs

  macos:
    name: macos
    needs: quality
    if: needs.quality.outputs.macos_required == 'true'
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Restore Rust dependency cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-14-rust-1.97.1-${{ hashFiles('Cargo.lock') }}
      - name: Install frozen frontend dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Prepare bundled CLI resource
        run: |
          cargo build --locked -p aizu-cli
          install -d apps/desktop/src-tauri/resources/bin
          install -m 755 target/debug/aizu apps/desktop/src-tauri/resources/bin/aizu
      - name: Check and test desktop Rust
        run: |
          cargo clippy --locked -p aizu-desktop --all-targets --all-features -- -D warnings
          cargo test --locked -p aizu-desktop --all-features
      - name: Build and verify development DMG
        if: needs.quality.outputs.package_required == 'true'
        run: |
          ./scripts/build-dev-dmg.sh
          ./scripts/ci/verify-dev-dmg.sh
      - name: Type-check and run embedded WebDriver E2E
        env:
          AIZU_STATE_DIR: ${{ runner.temp }}/aizu-e2e-state
          XDG_CONFIG_HOME: ${{ runner.temp }}/aizu-e2e-config
        run: |
          pnpm e2e:typecheck
          pnpm e2e:desktop
