name: Desktop CI

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "tests/e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "mise.toml"
      - "mise.lock"
      - "scripts/prepare-desktop-cli.sh"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Install frozen dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Validate frontend and E2E types
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm e2e:typecheck

  desktop-rust:
    name: desktop-rust
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Stage bundled CLI resource
        run: |
          cargo build --locked -p aizu-cli
          install -D -m 755 target/debug/aizu apps/desktop/src-tauri/resources/bin/aizu
      - name: Validate desktop Rust
        run: |
          cargo fmt --all --check
          cargo clippy -p aizu-desktop --all-targets --all-features --locked -- -D warnings
          cargo test -p aizu-desktop --all-features --locked

  build-check-macos:
    name: build-check-macos
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Install frozen dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Build unsigned application bundle
        run: pnpm --filter @aizu/desktop exec tauri build --debug --bundles app

  desktop-e2e-macos:
    name: desktop-e2e-macos
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
      - name: Install frozen dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Run embedded WebDriver E2E
        env:
          AIZU_STATE_DIR: ${{ runner.temp }}/aizu-e2e-state
          XDG_CONFIG_HOME: ${{ runner.temp }}/aizu-e2e-config
        run: pnpm e2e:desktop
